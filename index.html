<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gambar ke XML Alight Motion</title>
  <link rel="stylesheet" href="style.css">
  <!-- Menggunakan ImageTracerJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
  <!-- svgpath untuk mentransformasi path SVG (translate) agar kompatibel dengan AM -->
  <script src="https://unpkg.com/svgpath@2.6.0/svgpath.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Konverter Gambar ke XML Alight Motion</h2>
    <input type="file" id="imageInput" accept="image/*">

    <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
      <label for="maxShapesPerColor">Max shapes per color:</label>
      <input type="number" id="maxShapesPerColor" min="1" max="1000" value="200" style="width:80px;" />

      <label for="maxTotalShapes" style="margin-left:10px;">Max total shapes (0 = no limit):</label>
      <input type="number" id="maxTotalShapes" min="0" max="5000" value="0" style="width:80px;" />
    </div>

    <div id="previewContainer">
      <img id="imagePreview" alt="Preview Gambar">
    </div>
    <button id="convertBtn">Konversi & Unduh .XML</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
