<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gambar ke XML Alight Motion</title>
  <link rel="stylesheet" href="style.css">
  <!-- Menggunakan ImageTracerJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
  <!-- svgpath untuk mentransformasi path SVG (translate) agar kompatibel dengan AM -->
  <script src="https://unpkg.com/svgpath@2.6.0/svgpath.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Konverter Gambar ke XML Alight Motion</h2>
    <input type="file" id="imageInput" accept="image/*">
    <div id="previewContainer">
      <img id="imagePreview" alt="Preview Gambar">
    </div>
    <button id="convertBtn">Konversi & Unduh .XML</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
